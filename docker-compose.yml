services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bbbc
      POSTGRES_PASSWORD: bbbc
      POSTGRES_DB: bbbc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bbbc"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://bbbc:bbbc@db:5432/bbbc
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      OPEN_FINANCE_PROVIDER: ${OPEN_FINANCE_PROVIDER:-none}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "python -m app.cli migrate &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
